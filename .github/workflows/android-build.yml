name: Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
      - name: CFBD API smoke test (FBS/FCS)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, urllib.parse, urllib.request

          key = os.environ.get("CFBD_API_KEY", "").strip()
          if not key:
              raise SystemExit("CFBD_API_KEY repository secret is missing.")
          headers = {"Authorization": "Bearer " + key, "Accept": "application/json"}

          def get(path):
              req = urllib.request.Request("https://api.collegefootballdata.com/" + path, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  if response.status != 200:
                      raise RuntimeError(f"CFBD returned HTTP {response.status} for {path}")
                  return json.loads(response.read())

          today = datetime.datetime.now(datetime.timezone.utc).date()
          start, end = today - datetime.timedelta(days=1), today + datetime.timedelta(days=14)
          years = range(start.year, end.year + 1)
          selected = set()
          for year in years:
              for entry in get(f"calendar?year={year}"):
                  try:
                      ws = datetime.datetime.fromisoformat(entry["startDate"].replace("Z", "+00:00")).date()
                      we = datetime.datetime.fromisoformat(entry["endDate"].replace("Z", "+00:00")).date()
                  except (KeyError, ValueError):
                      continue
                  if ws <= end and we >= start:
                      selected.add((year, int(entry["week"]), entry["seasonType"]))

          totals = {"fbs": set(), "fcs": set()}
          for year, week, season_type in sorted(selected):
              base = f"games?year={year}&week={week}&seasonType={urllib.parse.quote(season_type)}"
              for division in ("fbs", "fcs"):
                  games = get(base + "&classification=" + division)
                  if not isinstance(games, list):
                      raise RuntimeError(f"CFBD {division} response was not a list")
                  for game in games:
                      hc = str(game.get("homeClassification", "")).lower()
                      ac = str(game.get("awayClassification", "")).lower()
                      if division == "fbs" and "fbs" not in (hc, ac):
                          raise RuntimeError("FBS endpoint returned a game with no FBS team classification")
                      if division == "fcs" and "fcs" not in (hc, ac):
                          raise RuntimeError("FCS endpoint returned a game with no FCS team classification")
                      kickoff = game.get("startDate")
                      if not kickoff:
                          continue
                      try:
                          game_date = datetime.datetime.fromisoformat(kickoff.replace("Z", "+00:00")).date()
                      except ValueError:
                          continue
                      if start <= game_date <= end:
                          totals[division].add(str(game.get("id") or kickoff + "|" + str(game.get("homeTeam")) + "|" + str(game.get("awayTeam"))))
          print(f"CFBD auth + calendar + division endpoints OK; next-14-day window: FBS={len(totals['fbs'])} FCS={len(totals['fcs'])} unique games.")
          if not selected:
              print("No calendar weeks overlap this window (likely offseason); endpoint authentication still verified.")
          PY
      - name: NCAA postseason bracket API smoke test (2025)
        run: |
          python - <<'PY'
          import json, urllib.request

          routes = {
              "men's basketball D1": "basketball-men/d1",
              "men's basketball D2": "basketball-men/d2",
              "men's basketball D3": "basketball-men/d3",
              "women's basketball D1": "basketball-women/d1",
              "women's basketball D2": "basketball-women/d2",
              "women's basketball D3": "basketball-women/d3",
              "women's volleyball D1": "volleyball-women/d1",
              "baseball D1": "baseball/d1",
          }
          for name, route in routes.items():
              url = f"https://ncaa-api.henrygd.me/brackets/{route}/2025"
              request = urllib.request.Request(url, headers={"User-Agent": "FreedomIPTV-CI/1.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{name}: HTTP {response.status}")
                  root = json.loads(response.read())
              championships = root.get("championships")
              if not isinstance(championships, list) or not championships:
                  raise RuntimeError(f"{name}: no championships array in 2025 bracket")
              games = [game for championship in championships
                       for game in (championship.get("games") or [])
                       if isinstance(game, dict)]
              if not games:
                  raise RuntimeError(f"{name}: no bracket games returned")
              positioned = sum(1 for game in games if game.get("bracketPositionId"))
              if not positioned:
                  raise RuntimeError(f"{name}: bracket games missing position IDs")
              print(f"{name}: {len(games)} games, {positioned} with bracket positions")
          PY
      - name: Build debug APK
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Freedom-IPTV-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
